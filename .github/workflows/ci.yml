name: CI

# Build + test on every push and PR. The java-client submodule is NOT a reactor
# module and is not published to Maven Central — it IS the source of the
# privacyidea-java-client dependency, so it must be built and installed into the
# local ~/.m2 first, then the plugin reactor (api/impl/dist) resolves it.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & install java-client submodule
        run: mvn -B -ntp -f java-client/pom.xml install

      - name: Build & test plugin (api / impl / dist)
        run: mvn -B -ntp install
