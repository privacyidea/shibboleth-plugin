name: CI

# Build + test on every push and PR. The java-client submodule is NOT a reactor
# module and is not published to Maven Central — it IS the source of the
# privacyidea-java-client dependency, so it must be built and installed into the
# local ~/.m2 first, then the plugin reactor (api/impl/dist) resolves it.
on:
  # push only on main (post-merge); PR branches are covered by pull_request, so
  # feature-branch commits run once, not twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & install java-client submodule
        run: mvn -B -ntp -f java-client/pom.xml install

      - name: Build & test plugin (api / impl / dist)
        run: mvn -B -ntp install

  # On pull requests, flag any newly-introduced dependency with a known GitHub Advisory
  # vulnerability (complements the always-on Dependabot alerts). PR-only: the action diffs
  # the base ref against the PR head, so it does not apply to push builds.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
