name: Dependency-Check

# OWASP Dependency-Check (known CVEs in dependencies). Runs on a weekly schedule
# and on manual dispatch only — NOT per push/PR — because its first run downloads
# the full NVD database (~370k records) and later runs pull incremental deltas.
#
# The NVD data is cached between runs; the cache is only written when a run
# COMPLETES, so let the first (seeding) run finish rather than cancelling it. The
# scan step is continue-on-error so a slow/rate-limited NVD update still lets the
# job finish and persist the cache. Add an NVD_API_KEY secret (environment "ci")
# to make the NVD feed fast and reliable.
on:
  schedule:
    - cron: '30 5 * * 1'   # weekly, Monday 05:30 UTC
  workflow_dispatch:

# Do NOT cancel an in-progress run: a push must never kill a long seeding run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # NVD_API_KEY is scoped to the "ci" environment, so this job must opt into it.
    environment: ci
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Persist the NVD DB across runs (unique key + prefix restore = always update).
      - name: Cache NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Build java-client submodule (dependency)
        run: mvn -B -ntp -f java-client/pom.xml install -DskipTests
      - name: Run OWASP Dependency-Check (report-only)
        continue-on-error: true
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:aggregate
          -DfailBuildOnCVSS=11
          -Dformat=SARIF
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check
