name: Actions Audit

# zizmor audits the GitHub Actions workflows themselves (unpinned actions, over-broad
# permissions, credential persistence, etc.) and uploads SARIF to code scanning.
# (Java SAST is handled by CodeQL; dependency CVEs by dependency-check.yml.)
on:
  # push only on main (post-merge baseline); PRs are covered by pull_request, so
  # feature-branch commits run once, not twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install zizmor
        run: pip install zizmor
      - name: Run zizmor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format sarif . > zizmor.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor
