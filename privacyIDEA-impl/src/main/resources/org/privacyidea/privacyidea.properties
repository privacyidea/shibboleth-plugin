############################################
#  Example authn.properties configuration  #
############################################


# Path for the authn.properties file: $idp_install_path/conf/authn/authn.properties

# To enable the MFA login flow and add the following line:
#idp.authn.flows = MFA

# To activate the SSO for all flows, make sure to enable it by adding (e.g.):
#idp.authn.MFA.reuseCondition=shibboleth.Conditions.TRUE
#idp.authn.Password.reuseCondition=shibboleth.Conditions.TRUE
#idp.authn.privacyIDEA.reuseCondition=shibboleth.Conditions.TRUE

# AuthnContextClassRef / supported principals.
# Declares which SAML AuthnContextClassRef (and other principal) values the privacyIDEA
# flow can satisfy and assert back to the SP. This is the standard Shibboleth mechanism:
# when an SP sends a RequestedAuthnContext, the IdP selects a flow whose supportedPrincipals
# match, and the matched class is asserted in the response. Leave empty for none.
# Comma-separated list. The privacyIDEA2 flow inherits this value unless it sets its own
# idp.authn.privacyIDEA2.supportedPrincipals (see privacyidea2.properties).
# Example (assert the REFEDS MFA profile, e.g. for eduGAIN/DFN-AAI federations):
#idp.authn.privacyIDEA.supportedPrincipals = https://refeds.org/profile/mfa,https://refeds.org/profile/sfa


