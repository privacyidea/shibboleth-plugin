###############################
#  PrivacyIDEA configuration  #
###############################

## SERVER CONFIG ##

# Required. URL of the privacyIDEA server.
privacyidea.server_url=https://localhost
# Realm to use for the requests. Leave empty for the server's default realm.
privacyidea.realm=defrealm
# Required. Verify the server's TLS certificate. Only true/false allowed. Always keep true in production.
privacyidea.verify_ssl=true
# HTTP timeout for all privacyIDEA requests, in milliseconds. Only digits allowed;
# empty (or invalid) keeps the default of 10000 (10s).
#privacyidea.http_timeout_ms=

## UI CONFIG ##

# Message shown above the OTP field when the server sends none of its own.
#privacyidea.default_message=
# Fixed OTP length. When set, the form auto-submits once this many characters are entered. Only digits allowed.
#privacyidea.otp_length=
# The OTP input placeholder ("hint") is configured via the message bundle key privacyidea.inputHint in
# $idp_install_path/messages/messages.properties (empty = no placeholder), so it can be translated per locale
# like the other UI labels.

## AUTHENTICATION FLOW CONFIG ##

# Required. One of: default, triggerChallenge, sendStaticPass, tokenSelection.
#   default          - the user types an OTP (the server may trigger challenges as usual).
#   triggerChallenge - triggers all of the user's challenges up front (needs a service account).
#   sendStaticPass   - sends a fixed static password up front (see static_pass below).
#   tokenSelection   - lists the user's tokens and lets them pick one. Triggerable tokens
#                      (push/WebAuthn/passkey) run their ceremony in place; others are used by typing their OTP.
privacyidea.authentication_flow=default

# Service account. Required for the triggerChallenge and tokenSelection flows. Its policy must grant the
# "triggerchallenge" right (triggerChallenge) or the "tokenlist" right (tokenSelection).
#privacyidea.service_name=
#privacyidea.service_pass=
# Optional. Realm of the service account, if different from privacyidea.realm.
#privacyidea.service_realm=

# Required for the sendStaticPass flow. The static password sent to the server.
#privacyidea.static_pass=

## PUSH TOKEN CONFIG ##

# Interval between push status polls, in seconds. Only digits allowed.
#privacyidea.polling_interval=
# Poll for the push confirmation directly from the browser. Only true/false allowed.
#privacyidea.poll_in_browser=
# URL the browser polls when poll_in_browser is enabled.
#privacyidea.poll_in_browser_url=

## PASSKEY CONFIG ##

# Hide the "Sign in with passkey" option. Only true/false allowed.
privacyidea.disable_passkey=false

## OTHER CONFIGURATION OPTIONS ##

# Comma-separated list of request headers to forward to privacyIDEA.
# Note: Accept-Language is always forwarded automatically, no need to list it here.
#privacyidea.forward_headers=
# Log debug messages to idp-process.log. Only true/false allowed.
privacyidea.debug=false
# Set to false to always show the username+password form, even if a username is already known
# (it will be prefilled). Only true/false allowed. Default: true.
#privacyidea.skip_first_step=

## REMEMBER ME (SKIP SECOND FACTOR) CONFIG ##

# Shows a "remember this device" checkbox on the privacyIDEA form. When checked and authentication succeeds,
# privacyIDEA issues a rotating persistent-session cookie (pi_remember_device); on later logins from that
# browser the plugin forwards it so the server can recognise the device and skip the second factor. The
# token rotates on every use (theft detection) and privacyIDEA owns the policy (validity, counters and the
# cookie lifetime). Requires privacyIDEA 3.14+ with a remember_device policy. Only applies when a preceding
# first factor (e.g. authn/Password) authenticated the user, so it is ignored in standalone mode.
#
# An API key is REQUIRED: it identifies this client to privacyIDEA and gates the feature per client. Obtain
# it from the privacyIDEA admin (POST /clients); it looks like pi_<key_id>_<secret>. Keep it secret.
#privacyidea.api_key=
# Only true/false allowed. Default: false.
#privacyidea.remember_device_enabled=

##########
#  Info  #
##########

# Wiring the MFA login flow (mfa-authn-config.xml) and authn.properties -- enabling the MFA flow, SSO
# reuseConditions, and supportedPrincipals / AuthnContextClassRef -- is documented in the README
# "Configuration" section, with ready-to-copy examples under docs/ (docs/mfaConfigExample,
# docs/authnConfigExample).

