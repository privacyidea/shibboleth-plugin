###############################
#  PrivacyIDEA configuration  #
###############################

## SERVER CONFIG ##

# Required.
privacyidea2.server_url=https://localhost
privacyidea2.realm=defrealm
# Required. Only true/false allowed:
privacyidea2.verify_ssl=true

## UI CONFIG ##

#privacyidea2.default_message=fix
#privacyidea2.otp_field_hint=fix
#privacyidea2.otp_length=fix

## AUTHENTICATION FLOW CONFIG ##

# Required. Allowed values are: default, triggerChallenge and sendStaticPass
privacyidea2.authentication_flow=default

# Required for triggerChallenge flow #
#privacyidea2.service_name=fix
#privacyidea2.service_pass=fix
# Optional:
#privacyidea2.service_realm=fix

# Required for sendStaticPass flow #
#privacyidea2.static_pass=fix

## PUSH TOKEN CONFIG ##

# Only digits allowed:
#privacyidea2.polling_interval=fix
#privacyidea2.poll_in_browser=fix
#privacyidea2.poll_in_browser_url=fix

## OTHER CONFIGURATION OPTIONS ##

# Comma-separated list of request headers to forward to privacyIDEA.
# Note: Accept-Language is always forwarded automatically, no need to list it here.
#privacyidea2.forward_headers=fix
# Only true/false allowed:
privacyidea2.debug=false
# Set to false to always show the username+password form, even if a username is already known (will be prefilled). Default: true
#privacyidea2.skip_first_step=true

## REMEMBER ME (SKIP SECOND FACTOR) CONFIG ##
# Shows a "remember this device" checkbox on the privacyIDEA form. When checked and authentication
# succeeds, an encrypted, self-expiring cookie (sealed with the IdP's shibboleth.DataSealer) is set,
# so the privacyIDEA second factor is skipped on this device for the configured number of days.
# The cookie is bound to the username and only honored when a preceding first factor (e.g.
# authn/Password) authenticated that same user, so it is ignored in standalone mode.
# Only true/false allowed. Default: false
#privacyidea2.remember_me_enabled=false
# Number of days the remember-me cookie is valid. Only digits allowed. Default: 30
#privacyidea2.remember_me_days=30
# Name of the remember-me cookie. Change only if it collides with another cookie. Default: shib_idp_pidea2_rememberme
#privacyidea2.remember_me_cookie_name=shib_idp_pidea2_rememberme


