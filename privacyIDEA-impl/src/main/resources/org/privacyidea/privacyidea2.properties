############################################
#  Example authn.properties configuration  #
############################################


# Path for the authn.properties file: $idp_install_path/conf/authn/authn.properties

# To enable the MFA login flow and add the following line:
#idp.authn.flows = MFA

# To activate the SSO for all flows, make sure to enable it by adding (e.g.):
#idp.authn.MFA.reuseCondition=shibboleth.Conditions.TRUE
#idp.authn.Password.reuseCondition=shibboleth.Conditions.TRUE
#idp.authn.privacyIDEA.reuseCondition=shibboleth.Conditions.TRUE

# Flow-descriptor settings for the privacyIDEA2 flow. Each idp.authn.privacyIDEA2.* key below
# falls back to the corresponding idp.authn.privacyIDEA.* value (in privacyidea.properties), so
# you only need to set one here to make privacyIDEA2 differ from the primary flow.
# AuthnContextClassRef / supported principals (see the privacyIDEA flow's entry for the full
# explanation): by default privacyIDEA2 asserts the same classes as privacyIDEA; override here.
#idp.authn.privacyIDEA2.supportedPrincipals = https://refeds.org/profile/mfa
# Other independently tunable keys (each defaults to the privacyIDEA flow's value):
#idp.authn.privacyIDEA2.order = 1000
#idp.authn.privacyIDEA2.lifetime = PT1H
#idp.authn.privacyIDEA2.reuseCondition = shibboleth.Conditions.TRUE


