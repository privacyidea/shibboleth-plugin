###############################
#  PrivacyIDEA configuration  #
###############################

## SERVER CONFIG ##

# Required. URL of the privacyIDEA server.
privacyidea2.server_url=https://localhost
# Realm to use for the requests. Leave empty for the server's default realm.
privacyidea2.realm=defrealm
# Required. Verify the server's TLS certificate. Only true/false allowed. Always keep true in production.
privacyidea2.verify_ssl=true
# HTTP timeout for all privacyIDEA requests, in milliseconds. Only digits allowed;
# empty (or invalid) keeps the default of 10000 (10s).
#privacyidea2.http_timeout_ms=

## UI CONFIG ##

# Message shown above the OTP field when the server sends none of its own.
#privacyidea2.default_message=
# Fixed OTP length. When set, the form auto-submits once this many characters are entered. Only digits allowed.
#privacyidea2.otp_length=
# The OTP input placeholder ("hint") is configured via the message bundle key privacyidea.inputHint in
# $idp_install_path/messages/messages.properties (empty = no placeholder), so it can be translated per locale
# like the other UI labels.

## AUTHENTICATION FLOW CONFIG ##

# Required. One of: default, triggerChallenge, sendStaticPass, tokenSelection.
#   default          - the user types an OTP (the server may trigger challenges as usual). Only this flow
#                      shows the password field on the username form and sends the password to privacyIDEA.
#                      If privacyIDEA rejects it without a challenge, or does not know the user, the
#                      username form shows an error.
#   triggerChallenge - triggers all of the user's challenges up front (needs a service account).
#   sendStaticPass   - sends a fixed static password up front (see static_pass below).
#   tokenSelection   - lists the user's tokens and lets them pick one. "Use" starts the challenge of the
#                      token: push/WebAuthn/passkey run in place, and for OTP/SMS/email tokens the user then
#                      types the code. Static password (spass) tokens are typed directly. The list leaves
#                      out certificate, sshkey and application-specific password (applspec) tokens, because
#                      privacyIDEA does not accept them for a login here.
privacyidea2.authentication_flow=default

# Service account. Required for the triggerChallenge and tokenSelection flows. Its policy must grant the
# "triggerchallenge" right (triggerChallenge), or the "tokenlist" and "triggerchallenge" rights (tokenSelection).
#privacyidea2.service_name=
#privacyidea2.service_pass=
# Optional. Realm of the service account, if different from privacyidea2.realm.
#privacyidea2.service_realm=

# Required for the sendStaticPass flow. The static password sent to the server.
#privacyidea2.static_pass=

## PUSH TOKEN CONFIG ##

# Interval between push status polls, in seconds. Only digits allowed.
#privacyidea2.polling_interval=
# Poll for the push confirmation directly from the browser. Only true/false allowed.
#privacyidea2.poll_in_browser=
# URL the browser polls when poll_in_browser is enabled.
#privacyidea2.poll_in_browser_url=

## PASSKEY CONFIG ##

# Hide the "Sign in with passkey" option. Only true/false allowed.
privacyidea2.disable_passkey=false
# How the username form offers the usernameless passkey. Default: button.
#   button      - The "Sign in with Passkey" button opens the browser dialog.
#   conditional - The autofill list of the username field shows the passkeys (WebAuthn conditional mediation).
#   immediate   - The click on the submit button first shows the passkeys on this device. Without a passkey,
#                 the form submits as usual. Only Chrome 149 and later support it.
# With conditional or immediate, the plugin creates a passkey challenge each time the username form shows.
# If the browser does not support the mode, the page shows the passkey button.
#privacyidea2.passkey_ui=
# Show the "Sign in with Passkey" button also with passkey_ui=conditional or immediate. Only true/false allowed.
# Default: true. The button covers security keys, passkeys on other devices, and other browsers.
#privacyidea2.passkey_button=

## OTHER CONFIGURATION OPTIONS ##

# Comma-separated list of request headers to forward to privacyIDEA.
# Note: Accept-Language is always forwarded automatically, no need to list it here.
#privacyidea2.forward_headers=
# Log debug messages to idp-process.log. Only true/false allowed.
privacyidea2.debug=false
# Set to false to always show the username+password form, even if a username is already known
# (it will be prefilled). Only true/false allowed. Default: true.
#privacyidea2.skip_first_step=
# Username first, then the IdP password. Only true/false allowed. Default: false.
# If true and the plugin runs in the MFA flow, the first page shows the username field, "Continue" and
# the passkey. "Continue" ends the plugin with the event "PasswordRequested".
# In conf/authn/mfa-authn-config.xml, send this event to authn/Password, and then run authn/privacyIDEA2
# again as the second factor. The password page fills in the username from the first page.
# See the README, section "Passkey or IdP password".
#privacyidea2.password_by_idp=

## REMEMBER ME (SKIP SECOND FACTOR) CONFIG ##

# Shows a "remember this device" checkbox on the privacyIDEA form. When checked and authentication succeeds,
# privacyIDEA issues a rotating persistent-session cookie (pi_remember_device); on later logins from that
# browser the plugin forwards it so the server can recognise the device and skip the second factor. The
# token rotates on every use (theft detection) and privacyIDEA owns the policy (validity, counters and the
# cookie lifetime). Requires privacyIDEA 3.14+ with a remember_device policy. Only applies when a preceding
# first factor (e.g. authn/Password) authenticated the user, so it is ignored in standalone mode.
#
# An API key is REQUIRED: it identifies this client to privacyIDEA and gates the feature per client. Obtain
# it from the privacyIDEA admin (POST /clients); it looks like pi_<key_id>_<secret>. Keep it secret.
#privacyidea2.api_key=
# Only true/false allowed. Default: false.
#privacyidea2.remember_device_enabled=

##########
#  Info  #
##########

# This is the second, independent privacyIDEA flow (authn/privacyIDEA2), configured exactly like the primary
# one above but with the privacyidea2.* prefix. Its Shibboleth flow-descriptor keys in authn.properties
# (idp.authn.privacyIDEA2.supportedPrincipals / .order / .lifetime / .reuseCondition) each fall back to the
# corresponding idp.authn.privacyIDEA.* value, so only set the ones that must differ from the primary flow.
#
# Wiring the MFA login flow (mfa-authn-config.xml) and authn.properties is documented in the README
# "Configuration" section, with ready-to-copy examples under docs/ (docs/mfaConfigExample,
# docs/authnConfigExample).

# More information about this project: https://github.com/privacyidea/shibboleth-plugin
